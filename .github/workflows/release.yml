name: Release to crates.io

# On a published tag `v*.*.*`, build and publish to crates.io.
# Requires repository secret CARGO_REGISTRY_TOKEN.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.+)"/\1/')
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Tag $TAG_VER != Cargo.toml $PKG_VER"
            exit 1
          fi
      - run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
